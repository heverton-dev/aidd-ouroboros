[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidd-ouroboros"
version = "1.2.0"
description = "Meta-Fábrica Universal Autônoma AIDD (AI-Driven Development)"
readme = "README.md"
authors = [{ name = "Heverton Eduardo Peres" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/hevertonperes/aidd-ouroboros"

[project.scripts]
ouroboros = "ouroboros:main"

[tool.setuptools]
py-modules = ["ouroboros"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["motores*"]

[tool.setuptools.package-data]
motores = ["governanca/*.json"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end pipeline integration tests with real fixtures",
    "integration: Integration tests"
]
