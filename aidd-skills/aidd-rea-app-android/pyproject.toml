[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidd-rea-app-android"
version = "1.0.0"
description = "Engenharia reversa de aplicativos mobile APK e binários nativos, extraindo telas, permissões, APIs e strings em contratos REA."
readme = "README.md"
authors = [{ name = "Heverton Eduardo Peres" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["aidd", "app-reengineer", "apk-reengineering", "binary-dissection", "rea", "reverse-engineering"]
dependencies = []

[project.scripts]
app-reengineer = "app_reengineer:main"

[tool.uv]
managed = true
package = false
